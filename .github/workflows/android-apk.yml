name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, android-gallery-apk, codex-android-launcher-icon, notification-2-0]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Configure Firebase when available
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android-app/app/google-services.json
            echo "Firebase Android configurado para este build."
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 não está configurado. O APK usará o fallback de notificações do Alvorecer, sem FCM instantâneo em segundo plano."
          fi
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: alvorecer-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
